
# Composite GitHub Action: Setup Build Tools
#
# Installs Ninja (build system) and ccache (compiler cache) on the
# current GitHub Actions runner.
#
# Supported operating systems:
#   - Linux:   APT
#   - Windows: Chocolatey
#   - macOS:   Homebrew
#
# Requirements:
#   - Bash and the corresponding package manager must be available.
#   - On Linux, the APT package index should be updated beforehand.
#
# Usage (after checking out the repository into ./project):
#   - name: Set up build tools
#     uses: ./project/.github/actions/setup-build-tools
#
# Note:
#   This action installs ccache but does not configure compiler caching.
#   Cache settings and persistence are handled by the calling workflow.

name: Setup build tools
description: Install Ninja and ccache on Linux, Windows, and macOS runners.

runs:
  using: composite
  steps:
    - name: Install Ninja and ccache
      shell: bash
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          Linux)
            sudo apt-get install -y ninja-build ccache
            ;;
          Windows)
            choco install ninja ccache -y --no-progress
            ;;
          macOS)
            brew install ninja ccache
            ;;
          *)
            echo "::error::Unsupported operating system: $RUNNER_OS"
            exit 1
            ;;
        esac

    # Print installed versions for easier troubleshooting and CI diagnostics.
    - name: Verify installed tools
      shell: bash
      run: |
        ninja --version
        ccache --version
