# Inspiration from:
# - https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/
# - https://github.com/cristianadam/HelloWorld/blob/master/.github/workflows/build_cmake.yml
# - https://github.com/marketplace/actions/vcpkg-action

name: GH Release

# Trigger this workflow manually, on pushes to main or version tags, and on
# pull requests targeting main.
on:
  workflow_dispatch: {} # allow running it manually
  push:
    branches:
      - main
    tags:
      - v**
  pull_request:
    branches:
      - main
    tags:
      - v**

# By default, the workflow token can read repository contents but cannot change them.
# Give write access only to individual jobs that need to publish or modify repository data.
permissions:
  contents: read

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "3"
  CCACHE_MAXSIZE: "1G"


jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC x86", ext: "windows-msvc-x86",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            vcpkg_triplet: x86-windows-static
          }
        - {
            name: "Windows Latest MSVC x64", ext: "windows-msvc-x64",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            vcpkg_triplet: x64-windows-static
          }
        - {
            name: "Windows Latest LLVM x86", ext: "windows-llvm-x86",
            os: windows-latest,
            cc: "clang", cxx: "clang++",
            # The compiler target is set to the 32-bit MSVC target for the x86 LLVM build.
            # This ensures that the generated binaries are compatible with 32-bit Windows systems.
            compiler_target: "i686-pc-windows-msvc",
            # This triplet is not provided by Neumann-A/my-vcpkg-triplets.
            # We define it locally and copy it into the upstream overlay directory
            # so it can reuse the existing LLVM toolchain and configuration.
            vcpkg_triplet: x86-win-llvm-static-rel
          }
        - {
            name: "Windows Latest LLVM x64", ext: "windows-llvm-x64",
            os: windows-latest,
            cc: "clang", cxx: "clang++",
            compiler_target: "x86_64-pc-windows-msvc",
            vcpkg_triplet: x64-win-llvm-static-rel
          }
        - {
            name: "Windows Latest MinGW x86", ext: "windows-mingw-x86",
            os: windows-latest,
            cc: "gcc", cxx: "g++",
            vcpkg_triplet: x86-mingw-static,
            # Choosing the UCRT version of MinGW because it is more compatible with modern Windows APIs and libraries.
            # The MSVCRT version is older and may have compatibility issues with newer software.
            # Choosing the POSIX threading model (posix) over the Windows threading model (win32) because
            # it is more compatible with cross-platform libraries and tools, and it provides better support
            # for C++11 and later features.
            mingw_url: "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/i686-16.2.0-release-posix-dwarf-ucrt-rt_v14-rev1.7z",
            mingw_dir: "./mingw/mingw32/bin"
          }
        - {
            name: "Windows Latest MinGW x64", ext: "windows-mingw-x64",
            os: windows-latest,
            cc: "gcc", cxx: "g++",
            vcpkg_triplet: x64-mingw-static,
            mingw_url: "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-posix-seh-ucrt-rt_v14-rev1.7z",
            mingw_dir: "./mingw/mingw64/bin"
          }
        - {
            name: "Ubuntu Latest GCC", ext: "linux",
            os: ubuntu-latest,
            cc: "gcc", cxx: "g++",
            vcpkg_triplet: x64-linux-release
          }
        - {
            name: "macOS Latest Clang", ext: "macos",
            os: macos-latest,
            cc: "clang", cxx: "clang++",
            vcpkg_triplet: x64-osx-release
          }

    defaults:
      run:
        # Run scripts with project directory as working directory
        working-directory: ./
        # Use bash as default shell
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "true"
        # Use path because of issue: https://github.com/johnwason/vcpkg-action/issues/14#issuecomment-1558312751
        # where vcpkg searches the parent directory tree for vcpkg.json, even if we do not want to use it
        path: project

    - name: Update Ubuntu package list
      if: runner.os == 'Linux'
      run: sudo apt-get update

    - name: Set up build tools
      uses: ./project/.github/actions/setup-build-tools

    - name: Set up MinGW
      if: contains(matrix.config.ext, 'windows-mingw')
      uses: ./project/.github/actions/setup-mingw
      with:
        url: ${{ matrix.config.mingw_url }}
        bin-dir: ${{ matrix.config.mingw_dir }}

    # vcpkg is too slow and it's giving problems on Linux, so we use it
    # only for Windows
    - name: Install dependencies
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get install -y valgrind libwxgtk3.2-dev libgtest-dev
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install wxwidgets googletest
        fi

    # - name: Install Ubuntu dependencies for vcpkg packages
    #   if: runner.os == 'Linux'
    #   run: |
    #     sudo apt-get install -y libx11-dev libxft-dev libxext-dev libwayland-dev \
    #       libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev \
    #       libdbus-1-dev libxi-dev libxtst-dev

    - name: Set up vcpkg
      if: runner.os == 'Windows'
      uses: ./project/.github/actions/setup-vcpkg
      with:
        triplet: ${{ matrix.config.vcpkg_triplet }}
        cache-key: ${{ matrix.config.ext }}_${{ env.BUILD_TYPE }}

    # vcpkg wxwidgets build failts with Chocolatey's packaging of MinGW. This step is
    # used for retrieving the error log.
    # https://stackoverflow.com/a/59361133/3049315
    # - name: Get error log
    #   if: always()
    #   uses: actions/upload-artifact@v7
    #   with:
    #     name: install-x64-mingw-static-dbg-out.log
    #     path: ./vcpkg/buildtrees/wxwidgets/install-x64-mingw-static-dbg-out.log

    # Restore compiler cache files from .ccache before building. The exact key is
    # unique to this workflow run and attempt; restore-keys lets GitHub fall back
    # to the most recently saved cache for the same OS, configuration, and build type.
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.config.ext }}-${{ env.BUILD_TYPE }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.config.ext }}-${{ env.BUILD_TYPE }}-ccache-

    # Set up MSVC environment for Windows builds using the Microsoft Visual Studio compiler (cl.exe).
    # This step is only executed if the selected compiler in the matrix configuration is 'cl'.
    - name: Set up MSVC environment
      if: matrix.config.cc == 'cl'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ startsWith(matrix.config.vcpkg_triplet, 'x86-') && 'x86' || 'x64' }}

    - name: Configure
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
        RUNNER_OS: ${{ runner.os }}
        VCPKG_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
        COMPILER_TARGET: ${{ matrix.config.compiler_target || '' }}
      working-directory: project
      run: |
        chmod a+x ./.github/scripts/*.cmake
        cmake -P ./.github/scripts/configure.cmake

    # Check the compiler target for Windows LLVM builds to ensure that the correct target is being used.
    - name: Check LLVM target
      if: contains(matrix.config.ext, 'windows-llvm')
      shell: pwsh
      working-directory: project
      run: |
        clang++ --version
        clang++ -dumpmachine
        Select-String -Path build/CMakeCache.txt -Pattern 'CMAKE_CXX_COMPILER:|CMAKE_CXX_COMPILER_TARGET:|VCPKG_TARGET_TRIPLET:'

    - name: Build
      env:
        CXX: ${{ matrix.config.cxx }}
        RUNNER_OS: ${{ runner.os }}
      working-directory: project
      run: |
        cmake -P ./.github/scripts/build.cmake

    # Persist the ccache directory so subsequent runs can reuse the compiler cache.
    # Using always() allows a partially populated compiler cache to be saved even if
    # the build fails. The condition also avoids saving when the restore step itself failed.
    - name: Save ccache to cache
      if: always() && steps.ccache-restore.outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: .ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    # Print the ccache summary to help diagnose cache hits, misses, and overall efficiency.
    - name: Show ccache statistics
      shell: cmake -P {0}
      run: |
        execute_process(COMMAND ccache -s)

    - name: Run tests
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
        RUNNER_OS: ${{ runner.os }}
      working-directory: project
      run: cmake -P ./.github/scripts/test.cmake

    - name: Install Strip
      working-directory: project
      run: cmake --install build --prefix instdir --strip --config $BUILD_TYPE

    - name: Generate artifact name
      id: generate-name
      shell: cmake -P {0}
      working-directory: project
      run: |
        execute_process(
          COMMAND cmake --system-information
          WORKING_DIRECTORY build
          OUTPUT_VARIABLE sysInfo
        )
        
        string(REGEX MATCH "CMAKE_PROJECT_NAME:STATIC=([^\n]*)" projectName ${sysInfo})
        set(projectName ${CMAKE_MATCH_1})
        
        string(REGEX MATCH "CMAKE_PROJECT_VERSION:STATIC=([^\n]*)" projectVersion ${sysInfo})
        set(projectVersion ${CMAKE_MATCH_1})
        
        # Save artifact name to GitHub environment variable
        set(finalName "${projectName}_${projectVersion}")
        set(archiveName "${finalName}_${{ matrix.config.ext }}.7z")
        set(debName "${finalName}_${{ matrix.config.ext }}.deb")
        set(rpmName "${finalName}_${{ matrix.config.ext }}.rpm")
        set(dmgName "${finalName}_${{ matrix.config.ext }}.dmg")
        set(nsisName "${finalName}_${{ matrix.config.ext }}_nsis.exe")
        set(wixName "${finalName}_${{ matrix.config.ext }}_wix.msi")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "finalName=${finalName}\n")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "archiveName=${archiveName}\n")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "debName=${debName}\n")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "rpmName=${rpmName}\n")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "dmgName=${dmgName}\n")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "nsisName=${nsisName}\n")
        file(APPEND "$ENV{GITHUB_OUTPUT}" "wixName=${wixName}")
    
    # https://github.com/NSIS-Dev/ci-examples/tree/main
    - name: Install NSIS & WiX Toolset
      if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        iwr -useb get.scoop.sh -outfile 'install.ps1'
        .\install.ps1 -RunAsAdmin
        scoop update
        scoop bucket add extras
        scoop install nsis
        scoop install wixtoolset

    - name: Pack Archive
      working-directory: project/instdir
      run: cmake -E tar cfv ../${{ steps.generate-name.outputs.archiveName }} --format=7zip .

    - name: Pack Windows Installer
      if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
      working-directory: project/build
      run: |
        if [[ ${{ matrix.config.ext }} =~ "x86" ]]; then
          cpack -C Release -G NSIS
        else
          cpack -C Release -G NSIS64
        fi
        cpack -C Release -G WIX
        mv package/${{ steps.generate-name.outputs.finalName }}.exe ../${{ steps.generate-name.outputs.nsisName }}
        mv package/${{ steps.generate-name.outputs.finalName }}.msi ../${{ steps.generate-name.outputs.wixName }}

    - name: Install RPM in Ubuntu
      if: runner.os == 'Linux'
      run: sudo apt-get install -y  rpm

    - name: Pack Linux DEB & RPM
      if: matrix.config.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
      working-directory: project/build
      run: |
        cpack -C Release -G DEB
        cpack -C Release -G RPM
        mv package/${{ steps.generate-name.outputs.finalName }}.deb ../${{ steps.generate-name.outputs.debName }}
        mv package/${{ steps.generate-name.outputs.finalName }}.rpm ../${{ steps.generate-name.outputs.rpmName }}

    - name: Pack MacOS DMG
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
      working-directory: project/build
      run: |
        cpack -C Release -G DragNDrop
        mv package/${{ steps.generate-name.outputs.finalName }}.dmg ../${{ steps.generate-name.outputs.dmgName }}

    - name: Upload Archive
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.generate-name.outputs.archiveName }}
        path: ./project/${{ steps.generate-name.outputs.archiveName }}

    - name: Upload Installer NSIS
      if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.generate-name.outputs.nsisName }}
        path: ./project/${{ steps.generate-name.outputs.nsisName }}

    - name: Upload Installer WIX
      if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.generate-name.outputs.wixName }}
        path: ./project/${{ steps.generate-name.outputs.wixName }}

    - name: Upload Linux DEB
      if: matrix.config.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.generate-name.outputs.debName }}
        path: ./project/${{ steps.generate-name.outputs.debName }}

    - name: Upload Linux RPM
      if: matrix.config.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.generate-name.outputs.rpmName }}
        path: ./project/${{ steps.generate-name.outputs.rpmName }}

    - name: Upload MacOS DMG
      if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.generate-name.outputs.dmgName }}
        path: ./project/${{ steps.generate-name.outputs.dmgName }}

    - name: Release Archive
      uses: softprops/action-gh-release@v0.1.15
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          ./project/${{ steps.generate-name.outputs.archiveName }}
          ./project/${{ steps.generate-name.outputs.nsisName }}
          ./project/${{ steps.generate-name.outputs.wixName }}
          ./project/${{ steps.generate-name.outputs.debName }}
          ./project/${{ steps.generate-name.outputs.rpmName }}
          ./project/${{ steps.generate-name.outputs.dmgName }}

