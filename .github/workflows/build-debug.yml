# Inspiration from:
# - https://cristianadam.eu/20191222/using-github-actions-with-c-plus-plus-and-cmake/
# - https://github.com/cristianadam/HelloWorld/blob/master/.github/workflows/build_cmake.yml
# - https://github.com/marketplace/actions/vcpkg-action

name: GH Debug

# Trigger this workflow manually, on pushes to main or version tags, and on
# pull requests targeting main.
on:
  workflow_dispatch: {} # allow running it manually
  push:
    branches:
      - main
    tags:
      - v**
  pull_request:
    branches:
      - main
    tags:
      - v**

env:
  BUILD_TYPE: Coverage
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "3"
  CCACHE_MAXSIZE: "1G"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC i686", ext: "windows-msvc-i686",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            vcpkg_triplet: x86-windows
          }
        - {
            name: "Windows Latest MSVC x86_64", ext: "windows-msvc-x86_64",
            os: windows-latest,
            cc: "cl", cxx: "cl",
            vcpkg_triplet: x64-windows
          }
        # - {
        #     name: "Windows Latest LLVM i686", ext: "windows-llvm-i686",
        #     os: windows-latest,
        #     cc: "clang", cxx: "clang++",
        #     vcpkg_triplet: x86-win-llvm
        #   }
        - {
            name: "Windows Latest LLVM x86_64", ext: "windows-llvm-x86_64",
            os: windows-latest,
            cc: "clang", cxx: "clang++",
            vcpkg_triplet: x64-win-llvm
          }
        - {
            name: "Windows Latest MinGW i686", ext: "windows-mingw-i686",
            os: windows-latest,
            cc: "gcc", cxx: "g++",
            vcpkg_triplet: x86-mingw-dynamic,
            # Choosing the UCRT version of MinGW because it is more compatible with modern Windows APIs and libraries.
            # The MSVCRT version is older and may have compatibility issues with newer software.
            # Choosing the POSIX threading model (posix) over the Windows threading model (win32) because
            # it is more compatible with cross-platform libraries and tools, and it provides better support
            # for C++11 and later features.
            mingw_url: "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/i686-16.2.0-release-posix-dwarf-ucrt-rt_v14-rev1.7z",
            mingw_dir: "./mingw/mingw32/bin",
            mingw_chocolatey_dir: "C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw32/bin"
          }
        - {
            name: "Windows Latest MinGW x86_64", ext: "windows-mingw-x86_64",
            os: windows-latest,
            cc: "gcc", cxx: "g++",
            vcpkg_triplet: x64-mingw-dynamic,
            mingw_url: "https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-posix-seh-ucrt-rt_v14-rev1.7z",
            mingw_dir: "./mingw/mingw64/bin",
            mingw_chocolatey_dir: "C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"
          }
        - {
            name: "Ubuntu Latest GCC", ext: "linux",
            os: ubuntu-latest,
            cc: "gcc", cxx: "g++",
            vcpkg_triplet: x64-linux
          }
        - {
            name: "macOS Latest Clang", ext: "macos",
            os: macos-latest,
            cc: "clang", cxx: "clang++",
            vcpkg_triplet: x64-osx
          }

    defaults:
      run:
        # Run scripts with project directory as working directory
        working-directory: ./
        # Use bash as default shell
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: "true"
        # Use path because of issue: https://github.com/johnwason/vcpkg-action/issues/14#issuecomment-1558312751
        # where vcpkg searches the parent directory tree for vcpkg.json, even if we do not want to use it
        path: project

    - name: Update Ubuntu package list
      if: runner.os == 'Linux'
      run: sudo apt-get update

    # # Chocolatey's MinGW does not work with vcpkg for some reason
    # - name: Set MinGW path
    #   if: contains(matrix.config.ext, 'windows-mingw')
    #   run: echo "${{ matrix.config.mingw_chocolatey_dir }}" >> $GITHUB_PATH

    - name: Generate MinGW cache key
      id: mingw-cache-key
      if: contains(matrix.config.ext, 'windows-mingw')
      shell: pwsh
      env:
        MINGW_URL: ${{ matrix.config.mingw_url }}
      run: |
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($env:MINGW_URL)
        $hash = [Convert]::ToHexString(
          [System.Security.Cryptography.SHA256]::HashData($bytes)
        ).ToLowerInvariant()
        "hash=$hash" >> $env:GITHUB_OUTPUT

    - name: Cache MinGW
      id: cache-mingw
      if: contains(matrix.config.ext, 'windows-mingw')
      uses: actions/cache@v6
      with:
        path: ./mingw
        key: ${{ runner.os }}-${{ matrix.config.ext }}-mingw-${{ steps.mingw-cache-key.outputs.hash }}

    # vcpkg wxwidgets build fails with Chocolatey's packaging of MinGW.
    # https://github.com/microsoft/vcpkg/issues/31496
    # https://stackoverflow.com/a/59361133/3049315
    # - name: Remove Chocolatey's MinGW
    #   if: contains(matrix.config.ext, 'windows-mingw')
    #   run: choco uninstall mingw
    - name: Install MinGW
      if: ${{ contains(matrix.config.ext, 'windows-mingw') && steps.cache-mingw.outputs.cache-hit != 'true' }}
      shell: cmake -P {0}
      run: |
        file(DOWNLOAD "${{ matrix.config.mingw_url }}" ./mingw.7z SHOW_PROGRESS)
        file(ARCHIVE_EXTRACT INPUT ./mingw.7z DESTINATION mingw)

    - name: Add MinGW to PATH
      shell: cmake -P {0}
      if: contains(matrix.config.ext, 'windows-mingw')
      run: |
        # Add to PATH environment variable
        file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${{ matrix.config.mingw_dir }}" mingw_dir)
        file(APPEND "$ENV{GITHUB_PATH}" "$ENV{GITHUB_WORKSPACE};${mingw_dir}")

    - name: Set up build tools
      uses: ./project/.github/actions/setup-build-tools

    - name: Install code coverage tool
      if: startsWith(matrix.config.ext, 'windows-msvc')
      run: choco install opencppcoverage

    # vcpkg is too slow and it's giving problems on Linux, so we use it
    # only for Windows
    - name: Install dependencies
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get install -y lcov valgrind libwxgtk3.2-dev libgtest-dev
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install wxwidgets googletest
        fi

    # - name: Install Ubuntu dependencies for vcpkg packages
    #   if: runner.os == 'Linux'
    #   run: |
    #     sudo apt-get install -y libx11-dev libxft-dev libxext-dev libwayland-dev \
    #       libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev \
    #       libdbus-1-dev libxi-dev libxtst-dev

    - name: Get LLVM vcpkg triplets
      if: runner.os == 'Windows'
      uses: actions/checkout@v7
      with:
        repository: 'Neumann-A/my-vcpkg-triplets'
        path: './my-vcpkg-triplets'

    - name: vcpkg
      id: vcpkg
      if: runner.os == 'Windows'
      uses: johnwason/vcpkg-action@master
      env:
        # Because we have the vcpkg.json file but don't use it, we must turn manifest mode off
        VCPKG_MANIFEST_MODE: OFF
      with:
        # Manifest builds on every CMake configure, which is not acceptable
        #manifest-dir: ${{ github.workspace }}
        pkgs: wxwidgets gtest
        triplet: ${{ matrix.config.vcpkg_triplet }}
        extra-args: --overlay-triplets=${{ github.workspace }}/my-vcpkg-triplets
        cache-key: ${{ matrix.config.ext }}
        revision: master
        token: ${{ github.token }}

    # vcpkg wxwidgets build failts with Chocolatey's packaging of MinGW. This step is
    # used for retrieving the error log.
    # https://stackoverflow.com/a/59361133/3049315
    # - name: Get error log
    #   if: always()
    #   uses: actions/upload-artifact@v7
    #   with:
    #     name: install-x64-mingw-static-dbg-out.log
    #     path: ./vcpkg/buildtrees/wxwidgets/install-x64-mingw-dynamic-dbg-out.log

    # Restore compiler cache files from .ccache before building. The exact key is
    # unique to this workflow run and attempt; restore-keys lets GitHub fall back
    # to the most recently saved cache for the same OS, configuration, and build type.
    - name: Restore ccache
      id: ccache-restore
      uses: actions/cache/restore@v6
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ matrix.config.ext }}-${{ env.BUILD_TYPE }}-ccache-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.config.ext }}-${{ env.BUILD_TYPE }}-ccache-

    # Set up MSVC environment for Windows builds using the Microsoft Visual Studio compiler (cl.exe).
    # This step is only executed if the selected compiler in the matrix configuration is 'cl'.
    - name: Set up MSVC environment
      if: matrix.config.cc == 'cl'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ startsWith(matrix.config.vcpkg_triplet, 'x86-') && 'x86' || 'x64' }}

    - name: Configure
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
        RUNNER_OS: ${{ runner.os }}
        VCPKG_TRIPLET: ${{ matrix.config.vcpkg_triplet }}
      working-directory: project
      run: |
        chmod a+x ./.github/scripts/*.cmake
        cmake -P ./.github/scripts/configure.cmake

    - name: Build
      env:
        CXX: ${{ matrix.config.cxx }}
        RUNNER_OS: ${{ runner.os }}
      working-directory: project
      run: |
        cmake -P ./.github/scripts/build.cmake

    # Persist the ccache directory so subsequent runs can reuse the compiler cache.
    # Using always() allows a partially populated compiler cache to be saved even if
    # the build fails. The condition also avoids saving when the restore step itself failed.
    - name: Save ccache to cache
      if: always() && steps.ccache-restore.outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: .ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

    # Print the ccache summary to help diagnose cache hits, misses, and overall efficiency.
    - name: Show ccache statistics
      shell: cmake -P {0}
      run: |
        execute_process(COMMAND ccache -s)

    - name: Run tests
      env:
        CC: ${{ matrix.config.cc }}
        CXX: ${{ matrix.config.cxx }}
        RUNNER_OS: ${{ runner.os }}
      working-directory: project
      run: cmake -P ./.github/scripts/test.cmake

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      if: runner.os == 'Linux'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    # - name: Generate lcov.info for coveralls
    #   if: runner.os == 'Linux'
    #   working-directory: project
    #   run: cmake --build build --config $BUILD_TYPE --target lcov

    # - name: Coveralls GitHub Action
    #   uses: coverallsapp/github-action@v1
    #   if: runner.os == 'Linux'
    #   with:
    #     base-path: project
    #     path-to-lcov: ./build/coverage/lcov.info
    #     debug: true

    - name: Coveralls GitHub Action
      uses: threeal/gcovr-action@v1.2.0
      if: runner.os == 'Linux'
      with:
        root: project
        coveralls-send: true
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean build directory for Coverity scan
      if: runner.os == 'Linux'
      working-directory: project/build
      run: |
        cmake --build . --target clean
        find . -name "*.gcda" -type f -delete
        find . -name "*.gcno" -type f -delete
        find . -name "*.o" -type f -delete

    - name: Coverity scan
      uses: vapier/coverity-scan-action@v1
      if: runner.os == 'Linux'
      with:
        email: ${{ secrets.COVERITY_SCAN_EMAIL }}
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
        working-directory: project/build
        command: 'ninja'

    - name: Install Strip
      working-directory: project
      run: cmake --install build --prefix instdir --strip --config $BUILD_TYPE
